<div class="workbench"><div><div class="caption"><span>主窗口 / 输入与结果</span><span>统一对齐 · 紧凑分组</span></div>
<article class="window main-window" aria-label="主窗口设计">
 <div class="titlebar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><span class="window-title">语落 VoxInk</span><button id="main-settings">设置</button></div>
 <div class="app-content">
  <section class="capture-zone" aria-labelledby="main-instruction">
   <div class="readiness"><span class="dot"></span>已准备好<span class="readiness-divider" aria-hidden="true"></span><span>本地识别</span></div>
   <h3 id="main-instruction">按住说话，松开写入。</h3>
   <div class="record-toolbar"><div class="keys" aria-label="快捷键 Option 加 Space"><kbd>Option</kbd><span>+</span><kbd>Space</kbd></div><button class="primary" id="main-record">演示录音</button></div>
  </section>
  <section class="result" aria-labelledby="result-heading">
   <div class="result-head"><h3 id="result-heading">最近一次结果</h3><span>简体中文 · 示例</span></div>
   <blockquote id="result-text">让想法自然流动，让文字轻轻落下。</blockquote>
   <div class="result-toolbar"><details><summary>识别原文</summary><p>讓想法自然流動，讓文字輕輕落下。</p></details><div class="action-row"><button id="copy-preview">复制文字</button><button id="paste-preview">再次写入</button></div></div>
   <p class="status-line" id="main-status" role="status">演示结果 · 未执行实际写入</p>
  </section>
 </div>
 <div class="window-footer"><span>所有内容均为演示数据</span><button id="open-guide">使用引导</button></div>
</article></div>
